{%include 'layout.html' %}  

```html
<div class="register-page">

    <div class="register-card">

        <div class="register-header">
            <h1>Create Account</h1>
            <p>Register for your library account</p>
        </div>

        <form id="registerForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="first_name">First name</label>
                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        placeholder="First name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last_name">Last name</label>
                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        placeholder="Last name"
                        required
                    >
                </div>

            </div>


            <div class="form-group">

                <label for="roles">Select your role</label>

                <select id="roles" name="user_roles" required>
                    <option value="" disabled selected>
                        Select a role
                    </option>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                    <option value="librian">Librarian</option>
                </select>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password2">Verify password</label>
                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        required
                    >
                </div>

            </div>


            <div id="enter_admin_code" class="admin-code">

                <div class="form-group">

                    <label for="admin_pin">
                        Admin password
                    </label>

                    <input
                        type="password"
                        id="admin_pin"
                        name="admin_pin"
                        placeholder="Enter admin password"
                    >

                </div>

            </div>


            <p id="registerMessage" class="register-message"></p>


            <button type="submit" class="register-button">
                <i class="fa-regular fa-circle-check"></i>
                Create Account
            </button>

        </form>


        <div class="register-footer">

            <a href="/">
                <i class="fa-regular fa-house"></i>
                Home
            </a>

        </div>

    </div>

</div>
```
